# Security hardening for Nginx

# Completely disable directory browsing
autoindex off;

# Return 404 for any requests targeting /storage or /images
location ^~ /storage {
    return 404;
}

location ^~ /images {
    return 404;
}

# Block execution of any script files in public root
location ~* \.(php|phtml|phar|sh|cgi|pl|py)$ {
    # Only allow index.php through the FastCGI handler
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    if ($request_uri ~* "\.(php|phtml|phar|sh|cgi|pl|py)(\?.*)?$" ) {
        return 404;
    }
}

# Block access to sensitive and hidden files
location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(env|git|sql|log|sh|bak|config)$ {
    deny all;
}
