# Security hardening for Nginx

# Completely disable directory browsing
autoindex off;

# Return 404 for any requests targeting /storage
location ^~ /storage {
    return 404;
}

# Strictly forbid PHP execution inside /images and static folders
location ~* ^/images/.*\.(php|phtml|phar|sh|cgi|pl|py)$ {
    deny all;
}

# Block access to sensitive and hidden files
location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(env|git|sql|log|sh|bak|config)$ {
    deny all;
}
