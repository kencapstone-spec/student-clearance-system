# Security hardening for Nginx

# Completely disable directory browsing
autoindex off;

# Block direct web access to internal directories
location ^~ /resources {
    return 404;
}

location ^~ /storage {
    return 404;
}

location ^~ /images {
    return 404;
}

location ^~ /app {
    return 404;
}

location ^~ /bootstrap {
    return 404;
}

location ^~ /config {
    return 404;
}

location ^~ /database {
    return 404;
}

location ^~ /routes {
    return 404;
}

location ^~ /tests {
    return 404;
}

location ^~ /vendor {
    return 404;
}

# Block ANY direct browser request to any .php file
# In Laravel, only internal rewrites to /index.php should be processed
if ($request_uri ~* "\.php(\?.*)?$") {
    return 404;
}

# Block access to sensitive and hidden files
location ~ /\.(?!well-known).* {
    deny all;
}

location ~* \.(env|git|sql|log|sh|bak|config|md|yml|yaml|json)$ {
    deny all;
}
